# Alokasi memori JVM dioptimalkan untuk RAM 16 GB (4GB alokasi maks Gradle)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Menjaga Gradle Daemon tetap aktif di latar belakang (Warm Start)
org.gradle.daemon=true

# Memaksimalkan penggunaan thread CPU (6 worker threads)
org.gradle.workers.max=6

# Mengaktifkan eksekusi tugas Gradle secara paralel
org.gradle.parallel=true

# Mengaktifkan caching build lokal untuk mempercepat build ulang
org.gradle.caching=true

# Konfigurasi Android & Kotlin bawaan proyek
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Menonaktifkan kompilasi incremental Kotlin untuk mencegah error "relativeTo failed" 
# akibat perbedaan drive antara pub cache (C:) dan source code proyek (D:)
kotlin.incremental=false